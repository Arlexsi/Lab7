<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шар </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Шар гадань</h1>

        <!-- сюда пишем вопрос -->
        <input type="text" id="question" placeholder="Напиши своє питання зі знаком ?">


        <div id="ball">
            <div id="window">
                <p id="answer"></p>
            </div>
        </div>

        <!-- подсказка снизу -->
        <p id="hint">Спочатку ваше питання та натисни на шар</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
